[project]
name = "translator-platform"
version = "0.1.0"
description = "Production-oriented translation platform (FastAPI + HF + Redis + Celery + Postgres)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.3",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "email-validator>=2.1",
  "spacy>=3.7",
  "transformers>=4.42",
  "torch>=2.2",
  "sentencepiece>=0.2.0",
  "langdetect>=1.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fakeredis>=2.20",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["app", "domain", "infra", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# Alembic migrations are autogenerated; don't lint their templated style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
