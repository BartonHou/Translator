name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # Install every runtime dep from pyproject EXCEPT the heavy ML packages,
        # which the suite stubs (see tests/conftest.py). Deriving the list from
        # pyproject keeps CI in sync automatically as new light deps are added,
        # instead of a hand-maintained list that silently drifts.
        run: |
          python -m pip install --upgrade pip
          python - <<'EOF'
          import pathlib, subprocess, sys, tomllib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          heavy = ("torch", "transformers", "spacy", "sentencepiece")
          light = [d for d in deps if not d.lower().startswith(heavy)]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *light, "pytest", "fakeredis", "ruff"])
          EOF
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
