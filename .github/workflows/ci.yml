name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # Only the light deps needed to run the suite; ML deps are stubbed in tests.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "pydantic>=2.6" "pydantic-settings>=2.2" \
            "sqlalchemy>=2.0" "redis>=5.0" "celery>=5.3" structlog \
            prometheus-client httpx pytest fakeredis ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
