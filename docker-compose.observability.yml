# Observability overlay: Prometheus scrapes the API's /metrics, Grafana visualizes.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
# Grafana: http://localhost:3000 (admin/admin), Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: translator_prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: translator_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana_data:
